name: Testes

# Roda a cada push na main e em pull requests.
# O deploy é feito pelo Laravel Cloud, que publica sozinho a cada push na main.
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-24.04

    # Roda tudo duas vezes: uma com SQLite (como no PC) e outra com PostgreSQL (como na nuvem).
    strategy:
      fail-fast: false
      matrix:
        banco: [ sqlite, pgsql ]

    # Banco PostgreSQL 16 temporário, só para os testes.
    # Ele sobe nos dois casos; o job do SQLite simplesmente não usa.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestoque_testes
          POSTGRES_USER: gestoque
          POSTGRES_PASSWORD: gestoque
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestoque"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v5

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, curl, gd, pdo_sqlite, pdo_pgsql
        coverage: none

    - name: Instalar dependências do Composer
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Configurar Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Instalar dependências do front
      run: npm ci

    - name: Checar tipos (TypeScript)
      run: npx tsc --noEmit

    - name: Compilar o front (Vite)
      run: npm run build

    - name: Preparar .env
      run: |
        cp .env.example .env
        php artisan key:generate

    # O phpunit.xml define sqlite/:memory:, mas não usa force="true",
    # então as variáveis abaixo têm prioridade no job do PostgreSQL.
    - name: Rodar testes (SQLite)
      if: matrix.banco == 'sqlite'
      run: php artisan test

    - name: Rodar testes (PostgreSQL 16)
      if: matrix.banco == 'pgsql'
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: gestoque_testes
        DB_USERNAME: gestoque
        DB_PASSWORD: gestoque
      run: php artisan test
