name: Deploy Laravel + React

on:
  push:
    branches: [ "main" ] # Executa toda vez que você enviar código para a branch main

jobs:
  laravel-deploy:
    # Usando a versão estável 24.04 para evitar os avisos de migração do GitHub
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # 1. Configura a versão correta do PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Altere para a versão exata do PHP do seu servidor
        extensions: mbstring, dom, fileinfo, curl

    # 2. Instala as dependências do Laravel (Composer) sem rodar testes quebrados
    - name: Install Composer Dependencies
      run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader

    # 3. Configura o Node.js atualizado (Node 22) para evitar o aviso de depreciação
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 4. Instala e compila o React unificado (Vite / Inertia)
    - name: Install & Build React (Vite)
      run: |
        npm install
        npm run build

    # 5. O DEPLOY REAL: Enviar para o seu servidor
    # IMPORTANTE: Descomente e configure uma das opções abaixo para os arquivos irem para a internet:
    
